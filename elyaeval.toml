# elyaeval configuration for this demo (read by elyaeval from the working
# directory upward). Any value can be overridden per run with ELYAEVAL_JUDGE_*
# environment variables, e.g. to try a hosted judge:
#   ELYAEVAL_JUDGE_PROVIDER=anthropic ELYAEVAL_JUDGE_MODEL=claude-sonnet-5 \
#   ANTHROPIC_API_KEY=... deepeval test run test_elyaeval_rag_qa.py

[judge]
# Local Ollama judge, a different model from the generator (llama3.2:3b) so a
# model never grades its own answers. Native Ollama API = schema-constrained
# JSON. qwen2.5:7b over llama3.1: on the same answers it scored faithfulness
# and contextual recall far closer to a manual check (llama3.1 flipped
# negations and missed facts that were in the context).
provider = "ollama"
model = "qwen2.5:7b"
# timeout_seconds = 900     # default for local providers
# max_output_tokens = 2048  # default for local providers: stops runaway JSON replies

[thresholds]
default = 0.7
# Share of the retrieved statements relevant to the question. The reranker
# keeps only relevant paragraphs, but a paragraph still holds 2-4 statements
# and a one-fact question needs one of them: 0.5-0.67 is a correct retrieval.
contextual_relevancy = 0.5

[cache]
# Re-running the suite after an unrelated change reuses identical judgements
# instead of re-waiting for the local judge (`elyaeval cache clear` to reset).
enabled = true

[regression]
# Defaults; run `elyaeval calibrate` on a --elyaeval-repeats 3 run to get
# noise-based per-metric tolerances for this judge and suite size.
tolerance = 0.02
alpha = 0.05
max_error_rate_increase = 0.05

[budget]
# A local 8B judge needs minutes per golden: cap a run's wall clock and let
# P0 goldens go first. Override per run: --elyaeval-budget-seconds 600.
max_seconds = 1800
on_exceed = "stop"

# [pricing]
# judge_per_hour = 0.40   # turn local judge time into dollars, if you want a cost figure
